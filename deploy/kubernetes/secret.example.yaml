# Example Secret with the source DSN. NOT listed in kustomization.yaml: create it yourself, for example
#   kubectl create secret generic wake-source --from-literal=dsn='postgres://wake:<password>@<host>:5432/<db>'
# or apply a copy of this file with the placeholder replaced. Never commit a real DSN.
apiVersion: v1
kind: Secret
metadata:
  name: wake-source
  labels:
    app.kubernetes.io/name: wake
type: Opaque
stringData:
  dsn: "postgres://wake:CHANGE_ME@postgres.example.internal:5432/app"
