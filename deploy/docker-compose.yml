# Wake local stack: dependencies and the Wake service. Run: docker compose -f deploy/docker-compose.yml up -d --wait
name: wake
services:
  postgres:
    image: postgres:17
    command: ["-c", "wal_level=logical", "-c", "max_wal_senders=20", "-c", "max_replication_slots=20"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # CONTROLLER (9094) is not published on the host.
      KAFKA_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s
    mem_limit: 1536m

  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  wake:
    image: ${RAYLD_WAKE_IMAGE:-thnhdatle/wake:dev}
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["run", "--config", "/etc/wake/config.yaml"]
    environment:
      WAKE_SOURCE_DSN: postgres://postgres:postgres@postgres:5432/app?sslmode=disable
      WAKE_LOG_FORMAT: text
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./config.compose.yaml:/etc/wake/config.yaml:ro
      - wake-data:/var/lib/wake
    read_only: true
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      nats: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/wake", "healthcheck", "--addr", "127.0.0.1:9093"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    mem_limit: 1g

volumes:
  pg-data:
  nats-data:
  wake-data:
