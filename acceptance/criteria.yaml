# Acceptance criteria for wake; acceptance/README.md describes the suite. Each
# criterion has thresholds for the reference machine (pass.mac) and for CI
# runners (pass.ci, selected with CI=1). Tests read them at run time.
# kind: functional (correctness under load and failures), performance
# (calibrated for the reference machine) or release (quickstart from a clean
# checkout).
#
# Measurement definitions:
#   M1 Commit time: host clock when the writer's COMMIT returns. All other times
#      are host clock unless stated.
#   M2 Final state: after writers stop and Wake confirmed the final LSN, consume
#      the topics from the beginning, apply events per key in seq order as
#      upserts (d deletes; a u whose before key differs from key deletes the
#      before key first; Kafka tombstones skipped; unchanged_columns keep the
#      previous value), and compare row by row with Postgres. Missing = rows in
#      Postgres absent or different at the sink.
#   M3 Lost / duplicates: writers record every committed change as
#      (table, key, ver); lost = recorded changes with no matching event;
#      duplicate = an event whose id was already seen.
#   M4 Order violation: after dropping events whose id was already seen, an
#      event whose seq is lower than that of an earlier delivered event for the
#      same key.
#   M5 T_cross (WAK-04): the test polls pg_replication_slots every 1 s;
#      T_cross = the first poll with slot lag above lag.warn_bytes.
#   M6 WAK-05 workload: open-model single-row INSERT transactions, ~200-byte
#      rows, 4 tables, 32 loadgen connections, Kafka topics with 6 partitions,
#      default sink batching; offered rate = offered_events_per_s, 1.1 x the
#      throughput threshold, so that passing shows headroom; 20 s warm-up, then
#      120 s measured; 3 runs, median. Throughput =
#      events acked by Kafka in the measured window / 120 s. Latency = Kafka ack
#      time - (event ts_ms + offset), where offset = median of (host time at
#      round-trip midpoint - Postgres now()) over 10 samples before the run; if
#      |offset| > 20 ms the run is reported Blocked (environment).
#   M7 Warm-up (WAK-10, WAK-12): measurement starts once all 3 instances have
#      observed a probe invalidation; for WAK-12 a read counts if it started
#      after commit + window.
project: wake
machine: "MacBook Pro M3 Pro 36 GB, Docker VM 8 CPU / 10 GB"
criteria:
  # WAK-01: Snapshot of a 1M-row table while 1,000 tx/s of inserts/updates/deletes
  # run from 10 s before the snapshot starts until 30 s after it ends; final sink
  # state (Kafka replayed, M2) equals Postgres. CI: 100k rows, 300 tx/s, same.
  # M1 commit time; M2 final state (missing = rows absent or different at sink).
  - id: WAK-01
    title: "Snapshot of a 1M-row table under 1,000 tx/s of mixed writes; final sink state equals Postgres"
    test: TestAcceptance_WAK01_SnapshotUnderLoad
    kind: functional
    real_deps: [postgres, kafka]
    requires: [docker]
    pass:
      mac: { missing_max: 0, state_match_pct_min: 100, rows: 1000000, tx_per_s: 1000, load_before_s: 10, load_after_s: 30 }
      ci: { missing_max: 0, state_match_pct_min: 100, rows: 100000, tx_per_s: 300, load_before_s: 10, load_after_s: 30 }

  # WAK-02: kill -9 of Wake at random points 20 times during streaming with large
  # (20 MiB, above the test stream.max_tx_bytes of 8 MiB, so spill runs) and small
  # transactions; half the kills land inside a large transaction.
  # M3 lost / duplicates (duplicate = event whose id was already seen).
  - id: WAK-02
    title: "kill -9 of Wake 20 times with large and small transactions; no loss, duplicates only after last confirmed LSN"
    test: TestAcceptance_WAK02_CrashNoLoss
    kind: functional
    real_deps: [postgres, kafka]
    requires: [docker]
    pass:
      mac: { kills: 20, kills_in_large_tx_pct: 50, large_tx_bytes: 20971520, max_tx_bytes: 8388608, lost_max: 0, duplicates_before_confirmed_lsn_max: 0, duplicates_removable_by_id_pct_min: 100 }
      ci: { kills: 20, kills_in_large_tx_pct: 50, large_tx_bytes: 20971520, max_tx_bytes: 8388608, lost_max: 0, duplicates_before_confirmed_lsn_max: 0, duplicates_removable_by_id_pct_min: 100 }

  # WAK-03: ADD/DROP/RENAME COLUMN and ALTER TYPE mid-stream under writes; a write
  # follows each DDL. Pass: no stop; schema-change event per DDL; every later
  # event has the new version.
  - id: WAK-03
    title: "ADD/DROP/RENAME COLUMN and ALTER TYPE mid-stream under writes"
    test: TestAcceptance_WAK03_SchemaChange
    kind: functional
    real_deps: [postgres, kafka]
    requires: [docker]
    pass:
      mac: { ddl_statements: 4, writes_after_each_ddl: 1, stops_max: 0, schema_events_per_ddl: 1, events_with_old_version_after_ddl_max: 0 }
      ci: { ddl_statements: 4, writes_after_each_ddl: 1, stops_max: 0, schema_events_per_ddl: 1, events_with_old_version_after_ddl_max: 0 }

  # WAK-04: Kafka down 3 min under writes at 500 tx/s; test config lag.interval: 5s,
  # lag.warn_bytes: 8MiB, lag.alert_webhook = a test receiver, other lag rules at
  # defaults. Pass: lag metric rises; alert POST received <= 60 s after T_cross;
  # after recovery lost = 0.
  # M3 lost; M5 T_cross (first 1 s poll of pg_replication_slots with lag above lag.warn_bytes).
  - id: WAK-04
    title: "Kafka down 3 min under 500 tx/s; lag metric rises, alert within 60 s of T_cross, nothing lost after recovery"
    test: TestAcceptance_WAK04_SinkOutage
    kind: functional
    real_deps: [postgres, kafka]
    requires: [docker]
    pass:
      mac: { outage_s: 180, tx_per_s: 500, lag_interval_s: 5, lag_warn_bytes: 8388608, slot_poll_interval_s: 1, lag_rises_min: 1, alert_after_t_cross_s_max: 60, lost_max: 0 }
      ci: { outage_s: 180, tx_per_s: 500, lag_interval_s: 5, lag_warn_bytes: 8388608, slot_poll_interval_s: 1, lag_rises_min: 1, alert_after_t_cross_s_max: 60, lost_max: 0 }

  # WAK-05: Throughput and latency, Postgres -> Kafka, single slot, Wake native;
  # workload M6. Mac: >= 5,000 events/s; commit->Kafka ack p99 < 200 ms.
  # CI: >= 1,500 events/s; p99 < 600 ms.
  # M1 commit time; M6 workload (open-model single-row INSERT transactions, ~200-byte
  # rows, 4 tables, 32 loadgen connections, 6-partition topics, default sink
  # batching; offered rate = offered_events_per_s (1.1 x the throughput threshold:
  # 5,500 tx/s on Mac, 1,650 on CI); 20 s warm-up then 120 s measured;
  # 3 runs, median; throughput = events acked by Kafka in the measured window /
  # 120 s; latency = Kafka ack time - (event ts_ms + offset), offset = median of
  # 10 samples before the run; |offset| > 20 ms => Blocked (environment)).
  - id: WAK-05
    title: "Throughput and latency Postgres to Kafka, single slot, Wake native"
    test: BenchmarkAcceptance_WAK05_Throughput
    kind: performance
    real_deps: [postgres, kafka]
    requires: [docker, mac]
    pass:
      mac: { events_per_s_min: 5000, offered_events_per_s: 5500, latency_p99_ms_max: 200, row_bytes: 200, tables: 4, loadgen_connections: 32, topic_partitions: 6, warmup_s: 20, measure_s: 120, runs: 3, clock_offset_samples: 10, clock_offset_ms_max: 20 }
      ci: { events_per_s_min: 1500, offered_events_per_s: 1650, latency_p99_ms_max: 600, row_bytes: 200, tables: 4, loadgen_connections: 32, topic_partitions: 6, warmup_s: 20, measure_s: 120, runs: 3, clock_offset_samples: 10, clock_offset_ms_max: 20 }

  # WAK-06: Per-key order: 1M updates over 10k keys from 16 concurrent writers,
  # each incrementing ver. CI: 200k updates.
  # M4 order violation (after dropping repeated ids, an event whose seq is lower
  # than that of an earlier delivered event for the same key).
  - id: WAK-06
    title: "Per-key order: 1M updates over 10k keys from 16 concurrent writers"
    test: TestAcceptance_WAK06_PerKeyOrder
    kind: functional
    real_deps: [postgres, kafka]
    requires: [docker]
    pass:
      mac: { updates: 1000000, keys: 10000, writers: 16, order_violations_max: 0 }
      ci: { updates: 200000, keys: 10000, writers: 16, order_violations_max: 0 }

  # WAK-07: Type fidelity: every type in type-mapping.md, incl. unchanged TOAST with
  # and without REPLICA IDENTITY FULL. Pass: 100% match to expected JSON.
  - id: WAK-07
    title: "Type fidelity for every type in type-mapping.md including unchanged TOAST"
    test: TestAcceptance_WAK07_TypeFidelity
    kind: functional
    real_deps: [postgres]
    requires: [docker]
    pass:
      mac: { json_match_pct_min: 100 }
      ci: { json_match_pct_min: 100 }

  # WAK-08: Webhook sink with 30% injected retryable failures (500, 503, 429,
  # connection reset) and 5% slow responses. Pass: 100% delivered; 100% valid
  # signatures; 0 out-of-order per key.
  # M4 order violation.
  - id: WAK-08
    title: "Webhook sink with 30% retryable failures and 5% slow responses"
    test: TestAcceptance_WAK08_Webhook
    kind: functional
    real_deps: [postgres]
    requires: [docker]
    pass:
      mac: { failure_pct: 30, slow_response_pct: 5, delivered_pct_min: 100, valid_signature_pct_min: 100, out_of_order_max: 0 }
      ci: { failure_pct: 30, slow_response_pct: 5, delivered_pct_min: 100, valid_signature_pct_min: 100, out_of_order_max: 0 }

  # WAK-09: Stampede: 3 cache instances, 1,000 concurrent GetOrLoad on a
  # just-expired key; loader takes 50 ms (< lock_timeout). Pass: loader calls = 1.
  - id: WAK-09
    title: "Stampede: 1,000 concurrent GetOrLoad on a just-expired key across 3 instances"
    test: TestAcceptance_WAK09_Stampede
    kind: functional
    real_deps: [redis]
    requires: [docker]
    pass:
      mac: { instances: 3, concurrent_calls: 1000, loader_ms: 50, loader_calls_max: 1 }
      ci: { instances: 3, concurrent_calls: 1000, loader_ms: 50, loader_calls_max: 1 }

  # WAK-10: CDC invalidation latency: commit (M1) -> key gone from L1 of all 3
  # instances; 100 single-row updates/s for 120 s over 1,000 cached keys after
  # warm-up (M7). Mac: p99 < 500 ms. CI: p99 < 1.5 s.
  # M1 commit time; M7 warm-up (measurement starts once all 3 instances have
  # observed a probe invalidation).
  - id: WAK-10
    title: "CDC invalidation latency from commit to key gone from L1 of all 3 instances"
    test: BenchmarkAcceptance_WAK10_InvalidationLatency
    kind: performance
    real_deps: [postgres, wake, kafka, redis]
    requires: [docker, mac]
    pass:
      mac: { latency_p99_ms_max: 500, instances: 3, updates_per_s: 100, duration_s: 120, cached_keys: 1000 }
      ci: { latency_p99_ms_max: 1500, instances: 3, updates_per_s: 100, duration_s: 120, cached_keys: 1000 }

  # WAK-11: Redis killed for 2 min under read load; test config L1 TTL 10 s,
  # stale_if_error 5 min; all keys warmed before the kill; the loader fails for
  # 10% of keys during the outage. Pass: 0 errors returned to callers; stale age
  # <= configured stale_if_error; recovery automatic (L2 used again <= 30 s after
  # Redis is back).
  - id: WAK-11
    title: "Redis killed for 2 min under read load; stale served, automatic recovery"
    test: TestAcceptance_WAK11_RedisOutage
    kind: functional
    real_deps: [redis]
    requires: [docker]
    pass:
      mac: { outage_s: 120, l1_ttl_s: 10, stale_if_error_s: 300, loader_failure_pct: 10, caller_errors_max: 0, stale_age_s_max: 300, recovery_s_max: 30 }
      ci: { outage_s: 120, l1_ttl_s: 10, stale_if_error_s: 300, loader_failure_pct: 10, caller_errors_max: 0, stale_age_s_max: 300, recovery_s_max: 30 }

  # WAK-12: 3-min concurrent read/write race through the full CDC invalidation
  # path; rows carry ver; window from writer COMMIT return (M1) to read start;
  # warm-up excluded (M7). Pass: 0 reads older than commit + 2 s window.
  # M1 commit time; M7 warm-up (a read counts if it started after commit + window).
  - id: WAK-12
    title: "3-min read/write race through CDC invalidation; no read older than commit + 2 s"
    test: TestAcceptance_WAK12_NoStaleBeyondWindow
    kind: functional
    real_deps: [postgres, wake, kafka, redis]
    requires: [docker]
    pass:
      mac: { duration_s: 180, window_s: 2, stale_reads_max: 0 }
      ci: { duration_s: 180, window_s: 2, stale_reads_max: 0 }

  # WAK-13: L1 hit path: Cache[V].Get on an L1 hit, single goroutine, metrics
  # enabled with pre-bound counters, V = 64-byte struct.
  # Mac: < 200 ns/op, 0 allocs/op. CI: < 600 ns/op (allocs kept at 0, the
  # allocation count is deterministic).
  - id: WAK-13
    title: "L1 hit path Cache[V].Get under 200 ns/op with zero allocations"
    test: BenchmarkAcceptance_WAK13_L1Get
    kind: performance
    real_deps: []
    requires: []
    pass:
      mac: { ns_per_op_max: 200, allocs_per_op_max: 0, value_bytes: 64 }
      ci: { ns_per_op_max: 600, allocs_per_op_max: 0, value_bytes: 64 }

  # WAK-14: Quickstart: README brings up Postgres + Kafka + Wake, an insert
  # appears in the topic. Pass: < 5 min, success.
  - id: WAK-14
    title: "Quickstart: README brings up Postgres, Kafka and Wake; an insert appears in the topic"
    test: TestAcceptance_WAK14_Quickstart
    kind: release
    real_deps: [docker]
    requires: [docker]
    pass:
      mac: { duration_s_max: 300, success_min: 1 }
      ci: { duration_s_max: 300, success_min: 1 }

  # WAK-15: Add a 500k-row table to a running pipeline while 500 tx/s write to it
  # and to existing tables; kill -9 once mid-snapshot; the run resumes from the
  # last acknowledged PK. CI: 50k rows, 150 tx/s.
  # M2 final state of the new table at the sink equals Postgres 100%; existing
  # tables unaffected (M3 lost = 0).
  - id: WAK-15
    title: "Add a 500k-row table to a running pipeline under 500 tx/s, kill -9 mid-snapshot, resume"
    test: TestAcceptance_WAK15_AddTableUnderLoad
    kind: functional
    real_deps: [postgres, kafka]
    requires: [docker]
    pass:
      mac: { rows: 500000, tx_per_s: 500, kills: 1, state_match_pct_min: 100, existing_tables_lost_max: 0 }
      ci: { rows: 50000, tx_per_s: 150, kills: 1, state_match_pct_min: 100, existing_tables_lost_max: 0 }
